<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Web BLE Scanner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1E1E1E;
            color: white;
            font-size: 14px;
            font-family: monospace;
        }
        button {
            background-color: #0A84FF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        button:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }
        button#disconnectBtn {
            background-color: #FF453A;
        }
        .terminal {
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .terminal-line { margin: 2px 0; }
        .rx { color: #32D74B; } 
        .sys { color: #FF9F0A; } 
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Dynamic BLE Scanner</h2>
        <p id="statusText">Status: Disconnected</p>
    </div>

    <div class="input-group">
        <label>Target Service UUID (Required for data)</label>
        <input type="text" id="serviceUuidInput" placeholder="e.g., 19b10000-e8f2-537e-4f6c-d104768a1214">
        
        <label>Target Characteristic UUID</label>
        <input type="text" id="charUuidInput" placeholder="e.g., 19b10001-e8f2-537e-4f6c-d104768a1214">
    </div>

    <button id="connectBtn">Scan & Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <h3>Terminal</h3>
    <div class="terminal" id="terminal"></div>
</div>

<script>
    let bluetoothDevice;
    let targetCharacteristic;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('statusText');
    const serviceUuidInput = document.getElementById('serviceUuidInput');
    const charUuidInput = document.getElementById('charUuidInput');

    function log(message, type = 'sys') {
        const line = document.createElement('div');
        line.className = `terminal-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        const serviceUUID = serviceUuidInput.value.trim().toLowerCase();
        const characteristicUUID = charUuidInput.value.trim().toLowerCase();

        try {
            // Build the configuration object dynamically based on user input
            let requestConfig = { acceptAllDevices: true };
            
            if (serviceUUID) {
                // If a Service UUID is provided, inject it into optionalServices
                // This unlocks the browser's permission to access it later.
                requestConfig.optionalServices = [serviceUUID];
                log(`Preparing to request permission for service: ${serviceUUID}`, 'sys');
            } else {
                log('Warning: No Service UUID provided. Data streaming will be blocked by the browser.', 'sys');
            }

            log('Scanning for nearby Bluetooth Devices...', 'sys');
            bluetoothDevice = await navigator.bluetooth.requestDevice(requestConfig);

            log(`Device selected: "${bluetoothDevice.name || 'Unnamed Device'}"`, 'sys');
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            log('Connecting to GATT Server...', 'sys');
            const server = await bluetoothDevice.gatt.connect();
            log('Successfully connected to GATT Server.', 'sys');

            statusText.textContent = `Status: Connected to ${bluetoothDevice.name || 'Unnamed Device'}`;
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;

            // If the user provided UUIDs, attempt to bridge the data stream
            if (serviceUUID && characteristicUUID) {
                try {
                    log('Traversing GATT hierarchy...', 'sys');
                    const service = await server.getPrimaryService(serviceUUID);
                    targetCharacteristic = await service.getCharacteristic(characteristicUUID);
                    
                    await targetCharacteristic.startNotifications();
                    targetCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);
                    
                    log('Data stream established.', 'sys');
                } catch (streamError) {
                    log(`Failed to establish stream: ${streamError.message}`, 'sys');
                }
            }

        } catch (error) {
            log(`Process terminated: ${error}`, 'sys');
        }
    });

    function handleIncomingData(event) {
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        log(`RX: ${decoder.decode(value)}`, 'rx');
    }

    disconnectBtn.addEventListener('click', () => {
        if (!bluetoothDevice) return;
        log('Disconnecting...', 'sys');
        if (bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    });

    function onDisconnected() {
        log('Device disconnected.', 'sys');
        statusText.textContent = 'Status: Disconnected';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        targetCharacteristic = null;
    }
</script>

</body>
</html>
