<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Web BLE Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #0A84FF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        button:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }
        button#disconnectBtn {
            background-color: #FF453A;
        }
        .terminal {
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .terminal-line { margin: 2px 0; }
        .rx { color: #32D74B; } /* Incoming data */
        .tx { color: #0A84FF; } /* Outgoing data */
        .sys { color: #FF9F0A; } /* System messages */
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #1E1E1E;
            color: white;
            font-size: 16px;
        }
        .input-group button {
            width: auto;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Arduino BLE Interface</h2>
        <p id="statusText">Status: Disconnected</p>
    </div>

    <button id="connectBtn">Connect to Arduino</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <h3>Terminal</h3>
    <div class="terminal" id="terminal"></div>

    <div class="input-group">
        <input type="text" id="cmdInput" placeholder="Enter command..." disabled>
        <button id="sendBtn" disabled>Send</button>
    </div>
</div>

<script>
    // Your specific custom UUIDs
    const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
    const CHARACTERISTIC_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';

    let bluetoothDevice;
    let textCharacteristic;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const cmdInput = document.getElementById('cmdInput');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('statusText');

    function log(message, type = 'sys') {
        const line = document.createElement('div');
        line.className = `terminal-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log('Requesting Bluetooth Device...', 'sys');
            
            // 1. Request device matching your custom service UUID
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [SERVICE_UUID] }]
            });

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            log(`Connecting to GATT Server...`, 'sys');
            
            // 2. Connect to the device
            const server = await bluetoothDevice.gatt.connect();

            // 3. Get the Service
            const service = await server.getPrimaryService(SERVICE_UUID);

            // 4. Get the Characteristic
            textCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // 5. Start listening for incoming notifications from the Arduino
            await textCharacteristic.startNotifications();
            textCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);

            log('Connected successfully!', 'sys');
            statusText.textContent = `Status: Connected to ${bluetoothDevice.name}`;
            
            // Update UI state
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
            sendBtn.disabled = false;
            cmdInput.disabled = false;

        } catch (error) {
            log(`Connection failed: ${error}`, 'sys');
        }
    });

    // Handle incoming data from Arduino
    function handleIncomingData(event) {
        // Decode the incoming byte array into a UTF-8 string
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const incomingText = decoder.decode(value);
        
        log(`RX: ${incomingText}`, 'rx');
    }

    // Send data to Arduino
    sendBtn.addEventListener('click', async () => {
        const text = cmdInput.value.trim();
        if (!text || !textCharacteristic) return;

        try {
            // Encode the string into a byte array
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            
            // Write to the Arduino characteristic
            await textCharacteristic.writeValue(data);
            
            log(`TX: ${text}`, 'tx');
            cmdInput.value = ''; // Clear input
        } catch (error) {
            log(`Send error: ${error}`, 'sys');
        }
    });

    // Allow sending by pressing Enter
    cmdInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendBtn.click();
    });

    disconnectBtn.addEventListener('click', () => {
        if (!bluetoothDevice) return;
        log('Disconnecting...', 'sys');
        if (bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    });

    function onDisconnected() {
        log('Device disconnected.', 'sys');
        statusText.textContent = 'Status: Disconnected';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        sendBtn.disabled = true;
        cmdInput.disabled = true;
    }
</script>

</body>
</html>
