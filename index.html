<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Web BLE Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #0A84FF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        button:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }
        button#disconnectBtn {
            background-color: #FF453A;
        }
        .terminal {
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .terminal-line { margin: 2px 0; }
        .rx { color: #32D74B; } /* Incoming data */
        .sys { color: #FF9F0A; } /* System messages */
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Arduino BLE Interface</h2>
        <p id="statusText">Status: Disconnected</p>
    </div>

    <button id="connectBtn">Connect to Bluetooth Device</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <h3>Terminal</h3>
    <div class="terminal" id="terminal"></div>
</div>

<script>
    // Specific custom UUIDs required to interact with the Arduino once connected
    const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
    const CHARACTERISTIC_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';

    let bluetoothDevice;
    let textCharacteristic;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('statusText');

    function log(message, type = 'sys') {
        const line = document.createElement('div');
        line.className = `terminal-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log('Requesting nearby Bluetooth Devices...', 'sys');
            
            // 1. Request any nearby device. optionalServices is required to access the 
            // custom service if the selected device happens to be the Arduino.
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            log(`Device selected: "${bluetoothDevice.name || 'Unnamed Device'}" (${bluetoothDevice.id})`, 'sys');
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            // 2. Connect to the GATT server
            log('Connecting to GATT Server...', 'sys');
            const server = await bluetoothDevice.gatt.connect();
            log('Successfully connected to GATT Server.', 'sys');

            // Update UI state
            statusText.textContent = `Status: Connected to ${bluetoothDevice.name || 'Unnamed Device'}`;
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;

            // 3. Attempt to discover the specific Arduino services
            try {
                log(`Requesting primary service (${SERVICE_UUID})...`, 'sys');
                const service = await server.getPrimaryService(SERVICE_UUID);
                log('Target service found.', 'sys');

                log(`Requesting characteristic (${CHARACTERISTIC_UUID})...`, 'sys');
                textCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
                log('Target characteristic found.', 'sys');

                log('Starting notifications...', 'sys');
                await textCharacteristic.startNotifications();
                textCharacteristic.addEventListener('characteristicvaluechanged', handleIncomingData);
                log('Notifications started. Ready to receive data.', 'sys');

            } catch (serviceError) {
                log(`Device does not broadcast the target Arduino service: ${serviceError.message}`, 'sys');
                log('Connection maintained, but no data will be received.', 'sys');
            }

        } catch (error) {
            log(`Connection process terminated: ${error}`, 'sys');
        }
    });

    // Handle incoming data from Arduino
    function handleIncomingData(event) {
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const incomingText = decoder.decode(value);
        
        log(`RX: ${incomingText}`, 'rx');
    }

    disconnectBtn.addEventListener('click', () => {
        if (!bluetoothDevice) return;
        log('Disconnecting...', 'sys');
        if (bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    });

    function onDisconnected() {
        log('Device disconnected.', 'sys');
        statusText.textContent = 'Status: Disconnected';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        textCharacteristic = null;
    }
</script>

</body>
</html>
