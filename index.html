<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web BLE Device Scanner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background-color: #0A84FF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        button:disabled {
            background-color: #333333;
            color: #888888;
            cursor: not-allowed;
        }
        button#disconnectBtn {
            background-color: #FF453A;
        }
        .terminal {
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .terminal-line { margin: 2px 0; }
        .sys { color: #FF9F0A; } /* System messages */
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Generic BLE Scanner</h2>
        <p id="statusText">Status: Disconnected</p>
    </div>

    <button id="connectBtn">Scan & Connect to Any Device</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <h3>Terminal</h3>
    <div class="terminal" id="terminal"></div>
</div>

<script>
    let bluetoothDevice;

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const terminal = document.getElementById('terminal');
    const statusText = document.getElementById('statusText');

    function log(message, type = 'sys') {
        const line = document.createElement('div');
        line.className = `terminal-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight; // Auto-scroll
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log('Scanning for nearby Bluetooth Devices...', 'sys');
            
            // Request any nearby device. No specific filters or optionalServices.
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true
            });

            log(`Device selected: "${bluetoothDevice.name || 'Unnamed Device'}" (${bluetoothDevice.id})`, 'sys');
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

            // Connect to the GATT server
            log('Connecting to GATT Server...', 'sys');
            const server = await bluetoothDevice.gatt.connect();
            log('Successfully connected to GATT Server.', 'sys');

            // Update UI state
            statusText.textContent = `Status: Connected to ${bluetoothDevice.name || 'Unnamed Device'}`;
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;

            log('Ready. Note: Reading data streams requires defining specific UUIDs in the code.', 'sys');

        } catch (error) {
            log(`Connection process terminated: ${error}`, 'sys');
        }
    });

    disconnectBtn.addEventListener('click', () => {
        if (!bluetoothDevice) return;
        log('Disconnecting...', 'sys');
        if (bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    });

    function onDisconnected() {
        log('Device disconnected.', 'sys');
        statusText.textContent = 'Status: Disconnected';
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
    }
</script>

</body>
</html>
